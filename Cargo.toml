[package]
name = "asar2"
version = "0.1.0"
edition = "2021"
description = "A blazing-fast, zero-copy, flat-indexed ASAR archive reader and writer."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/TomieAi/asar2-rs"
homepage = "https://github.com/TomieAi/asar2-rs"
readme = "README.md"
keywords = ["asar", "electron", "archive", "zero-copy", "filesystem"]
categories = ["compression", "filesystem", "parser-implementations"]

[dependencies]
byteorder = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
thiserror = "1"

[dev-dependencies]
include_dir = "0.7"

[features]
default = ["write"]
integrity = ["sha2"]
write = ["integrity"]
