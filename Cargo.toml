[package]
name = "asar2"
description = "A high-performance zero-copy, flat-indexed crate to read and write asar archives."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[dependencies]
byteorder = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
thiserror = "1"

[dev-dependencies]
include_dir = "0.7"

[features]
default = ["write"]
integrity = ["sha2"]
write = ["integrity"]
